function sampleInt(max){if(!max)return 0;const c=(window.crypto&&window.crypto.getRandomValues)?window.crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967296);return c%max}
function stopTimer(){if(timer!==null){clearInterval(timer);timer=null}}
function stopMusic(){for(const a of [$('successSong'),$('wrongSong')]){a.pause();try{a.currentTime=0}catch(e){}}}
function playTune(ok){if(!soundOn)return;stopMusic();const a=$(ok?'successSong':'wrongSong');try{a.volume=1;const p=a.play();if(p&&p.catch)p.catch(()=>tone(ok?880:220,.25))}catch(e){tone(ok?880:220,.25)} if(ok){siiii();showFlash()}}
function showFlash(){const f=document.createElement('div');f.className='flash';f.textContent='⚽ SIIIIUUU!';document.body.append(f);setTimeout(()=>f.remove(),1900)}
function tone(freq,dur){if(!soundOn)return;try{const cx=new (window.AudioContext||window.webkitAudioContext)(),o=cx.createOscillator(),g=cx.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(cx.destination);g.gain.setValueAtTime(.15,cx.currentTime);g.gain.exponentialRampToValueAtTime(.001,cx.currentTime+dur);o.start();o.stop(cx.currentTime+dur);o.onended=()=>cx.close()}catch(e){}}
function siiii(){if(!soundOn)return;setTimeout(()=>{try{if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Siiiiuuuuu!');u.lang='pt-PT';u.rate=.82;u.pitch=1.3;u.volume=.85;speechSynthesis.speak(u)}}catch(e){}},220)}
function updateChrome(){const total=students-absent.size;$('participation').textContent=`${[...called].filter(n=>!absent.has(n)).length}/${total} alunos já chamados`;$('currentStep').textContent=question<0?'PREPARAÇÃO':question>=QS.length?'CONCLUÍDO':`PERGUNTA ${question+1} / ${QS.length}`;$('headerProgress').textContent=question<0?'SORTEIO SEM REPETIÇÕES':question>=QS.length?'MISSÃO CUMPRIDA':`${question+1} / ${QS.length} DESAFIOS`;$('progressBar').style.width=(question<0?0:question>=QS.length?100:100*question/QS.length)+'%'}
function rosterMarkup(){let arr=[];for(let i=1;i<=students;i++){const cl=['student',absent.has(i)?'absent':'',called.has(i)?'done':'',i===current?'current':''].filter(Boolean).join(' ');arr.push(`<button class="${cl}" type="button" data-student="${i}" title="N.º ${i}: ${absent.has(i)?'falta':'presente'}">${i}</button>`)}return `<div class="roster">${arr.join('')}</div>`}
function attachAbsences(){stage.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{const n=+b.dataset.student;if(absent.has(n))absent.delete(n);else absent.add(n);if(n===current){current=null}setup();})}
function setup(){phase='setup';stopTimer();updateChrome();stage.innerHTML=`<div class="intro"><div class="bigtitle">⚓ O REINO RESPONDE</div><div class="lead">Quatro desafios para recuperar as pistas da investigação. A situação-problema e a questão orientadora serão respondidas em casa. <strong>O número sorteado responde em voz alta.</strong> Ninguém volta a ser sorteado enquanto houver colegas presentes por chamar.</div><div class="settings"><label>Alunos numerados de 1 a <input id="studentCount" type="number" min="1" max="45" value="${students}" class="number-input"></label><label><input id="soundCheck" type="checkbox" ${soundOn?'checked':''}> Som ligado</label><label><input id="timeCheck" type="checkbox" checked disabled> 30 segundos</label></div>${rosterMarkup()}<div class="tools"><button class="btn alt small" id="tryCorrect">▶ Testar música: certo</button><button class="btn alt small" id="tryWrong">▶ Testar música: errado</button><button class="btn gold" id="begin">INICIAR SORTEIO</button></div></div>`;
 $('studentCount').onchange=e=>{const n=Math.max(1,Math.min(45,parseInt(e.target.value,10)||20));if(n!==students){students=n;called.clear();absent.clear()}setup()};
 $('soundCheck').onchange=e=>{soundOn=e.target.checked;updateSound();if(!soundOn)stopMusic()};
 $('tryCorrect').onclick=()=>playTune(true);$('tryWrong').onclick=()=>playTune(false);$('begin').onclick=()=>{stopMusic();question=0;screenDraw()};attachAbsences();}
function available(){let a=[];for(let i=1;i<=students;i++)if(!absent.has(i)&&!called.has(i))a.push(i);if(!a.length){called.clear();for(let i=1;i<=students;i++)if(!absent.has(i))a.push(i)}return a}
function screenDraw(){phase='draw';stopTimer();stopMusic();updateChrome();if(absent.size>=students){stage.innerHTML='<h2>Não há alunos presentes marcados.</h2><div class="bottom"><button class="btn" id="goSettings">Corrigir faltas</button></div>';$('goSettings').onclick=setup;return}const q=QS[question];stage.innerHTML=`<div class="sortscreen"><div class="topic">${q.tag} · ${question+1}/${QS.length}</div><div class="sorttitle">🎲 Quem vai responder?</div><div class="giant" id="selectedNumber">?</div><div class="lead" id="drawStatus">Sorteio por número, sem repetir alunos presentes.</div><div class="tools"><button class="btn gold" id="drawButton">🎯 SORTEAR ALUNO</button><button class="btn" id="goQuestion" disabled>VER PERGUNTA</button></div><p class="hint">${[...called].filter(n=>!absent.has(n)).length} já chamados · ${students-absent.size} presentes</p></div>`;$('drawButton').onclick=()=>{const av=available();current=av[sampleInt(av.length)];$('selectedNumber').textContent=current;$('drawStatus').textContent=`ALUNO N.º ${current} · PREPARA-TE!`;$('goQuestion').disabled=false;$('drawButton').disabled=true;tone(680,.15);updateChrome()};$('goQuestion').onclick=()=>{if(current!==null){called.add(current);screenQuestion()}}}
function screenQuestion(){phase='question';answered=false;remaining=30;stopTimer();updateChrome();const q=QS[question];stage.innerHTML=`<div class="questionHead"><div class="topic">${q.tag}</div><div class="pick"><div class="numlabel">ALUNO<br>N.º</div><div class="num">${current}</div></div><div class="clock" id="clock">30</div></div><h2 class="qtitle">${q.prompt}</h2><p class="source">Fonte: ${q.source}</p><div class="options">${q.options.map((opt,i)=>`<button class="opt" data-opt="${i}" disabled><span class="letter">${'ABCD'[i]}</span>${opt}</button>`).join('')}</div><div id="feedback"></div><div class="bottom"><button class="btn alt" id="startClock">▶ COMEÇAR · 30 s</button><button class="btn alt" id="drawAgain">Outra pessoa (ausente)</button><button class="btn" id="next" disabled>${question===QS.length-1?'VER TPC':'PRÓXIMA PERGUNTA'}</button></div>`;stage.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answer(+b.dataset.opt));$('startClock').onclick=()=>{stage.querySelectorAll('[data-opt]').forEach(b=>b.disabled=false);$('startClock').disabled=true;tone(480,.12);timer=setInterval(()=>{if(answered)return;remaining--;const c=$('clock');c.textContent=remaining;c.classList.toggle('urgent',remaining<=7);if(remaining<=5&&remaining>0)tone(550,.09);if(remaining<=0)answer(-1)},1000)};$('drawAgain').onclick=()=>{called.delete(current);absent.add(current);current=null;screenDraw()};$('next').onclick=next;}
function answer(chosen){if(answered)return;answered=true;stopTimer();const q=QS[question];const good=chosen===q.correct;if(good)score++;const buttons=[...stage.querySelectorAll('[data-opt]')];for(const b of buttons){b.disabled=true;const n=+b.dataset.opt;if(n===q.correct)b.classList.add('correct');else if(n===chosen)b.classList.add('wrong')};const f=$('feedback');f.className='answer '+(good?'good':'bad');f.innerHTML=`<strong>${good?'✓ RESPOSTA CORRETA':chosen===-1?'⏱ TEMPO ESGOTADO':'✗ VAMOS REVER A FONTE'}</strong> — ${q.why}`;$('next').disabled=false;$('drawAgain').disabled=true;playTune(good);}
function next(){stopMusic();stopTimer();question++;current=null;if(question>=QS.length)result();else screenDraw()}
function result(){phase='end';updateChrome();stage.innerHTML=`<div class="bigtitle">🏁 MISSÃO CUMPRIDA</div><div class="score">${score} / ${QS.length} respostas certas</div><div class="result final-answer"><div class="answer-section"><div class="answer-label">🏠 TRABALHO DE CASA · TPC</div><p class="final-caution">Responde <strong>individualmente, no caderno diário</strong>, às duas perguntas. Consulta os apontamentos e as fontes analisadas na aula. <strong>Justifica as tuas respostas com evidências históricas.</strong></p></div><div class="answer-section"><div class="answer-label">1 · SITUAÇÃO-PROBLEMA</div><div class="answer-question">Como poderia Portugal proteger os seus interesses económicos e beneficiar mais do comércio que realizava?</div></div><div class="answer-section highlight"><div class="answer-label">2 · QUESTÃO ORIENTADORA</div><div class="answer-question">Que medidas foram desenvolvidas para superar a crise comercial portuguesa dos finais do século XVII?</div></div><p class="final-caution">TPC para a próxima aula: escreve respostas completas e fundamentadas. Não basta enumerar medidas.</p></div><div class="bottom"><button class="btn gold" id="again">↻ NOVA RONDA · OUTROS ALUNOS</button><button class="btn alt" id="home">Configuração</button><button class="btn alt" id="resetRoster">Reiniciar todos os sorteios</button></div>`;$('again').onclick=()=>{question=0;score=0;screenDraw()};$('home').onclick=setup;$('resetRoster').onclick=()=>{if(confirm('Queres apagar os registos dos alunos já sorteados?')){called.clear();question=-1;score=0;setup()}}}
function updateSound(){$('soundButton').textContent=soundOn?'🔊 Som ligado':'🔇 Som desligado'}
$('soundButton').onclick=()=>{soundOn=!soundOn;updateSound();if(!soundOn)stopMusic()};$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};$('settingsButton').onclick=()=>{stopMusic();stopTimer();setup()};document.addEventListener('keydown',e=>{if(phase!=='question'||answered||!$('startClock')?.disabled)return;const ix='abcd'.indexOf(e.key.toLowerCase());if(ix>=0)answer(ix);else if(/^[1-4]$/.test(e.key))answer(Number(e.key)-1)});
updateSound();setup();
</script></body></html>
